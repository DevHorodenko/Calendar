spring:
  application:
    name: calendar-backend

  datasource:
    # H2 em arquivo. AUTO_SERVER deixa uma segunda abertura do app se conectar ao
    # mesmo banco em vez de morrer com "database may be already in use".
    url: jdbc:h2:file:${calendar.data-dir:./data}/calendario;AUTO_SERVER=TRUE
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # O schema e do Flyway; o Hibernate so confere se bate com as entidades.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # Jackson 3 ja serializa datas em ISO-8601; so os nulos precisam ser omitidos.
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

calendar:
  # Origem do Vite em desenvolvimento; no app instalado o front vem do proprio jar.
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  # Teto de dias que uma consulta pode pedir de uma vez, para a visao de ano nao virar varredura infinita.
  max-range-days: 800

  reminders:
    # Lembretes. O disparador so roda com o aplicativo aberto -- ele mora na bandeja
    # justamente para continuar de pe depois que a janela fecha.
    enabled: ${REMINDERS_ENABLED:true}
    # De meio em meio minuto: fino o bastante para "15 minutos antes" chegar na hora,
    # largo o bastante para nao pesar num banco de arquivo.
    poll-millis: 30000
    # Folga na subida, para a primeira varredura nao disputar espaco com o Flyway.
    initial-delay-millis: 20000
    # Depois disso o lembrete daquela ocorrencia desiste, em vez de insistir numa
    # credencial errada de meio em meio minuto ate o evento comecar.
    max-attempts: 3
    # Por quanto tempo o registro de envio fica de pe. Ele so impede repeticao.
    history-days: 60
    http-timeout-seconds: 15
    purge-cron: "0 40 3 * * *"

logging:
  level:
    org.horodenko.calendar: INFO
