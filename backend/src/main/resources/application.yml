spring:
  application:
    name: calendar-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/calendar}
    username: ${DB_USER:calendar}
    password: ${DB_PASSWORD:calendar}

  jpa:
    hibernate:
      # O schema e do Flyway; o Hibernate so confere se bate com as entidades.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # Jackson 3 ja serializa datas em ISO-8601; so os nulos precisam ser omitidos.
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

calendar:
  # Origem do Vite em desenvolvimento; o frontend chama a API a partir daqui.
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  # Teto de dias que uma consulta pode pedir de uma vez, para a visao de ano nao virar varredura infinita.
  max-range-days: 800

logging:
  level:
    org.horodenko.calendar: INFO
